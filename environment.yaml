name: sbi
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Core scientific stack
  - numpy=1.26.4
  - scipy=1.12.0
  - pandas
  - matplotlib-base
  - seaborn
  - scikit-learn
  - h5py
  # ML / SBI
  - pytorch
  - sbi=0.25.0
  - nflows=0.14
  - pyknos=0.16.0
  - zuko=1.4.1
  - pyro-ppl=1.9.1
  - pyro-api=0.1.2
  # Bayesian
  - pymc
  - arviz
  - pytensor
  - xarray
  - xarray-einstats
  - h5netcdf
  # Utilities
  - tensorboard
  - tqdm
  - joblib
  - cloudpickle
  - networkx
  - sympy
  - filelock
  - pyyaml
  - rich
  - colorama
  # Jupyter
  - ipykernel
  - ipython
  - ipywidgets
  - notebook
  - nbconvert
  # Image
  - pillow
  # Testing
  - pytest
  # Build
  - pip
  - setuptools
  - wheel
  - pip:
      - astropy==7.2.0
      - ipympl==0.9.8
      - pyvista==0.47.1
      - pyvistaqt==0.11.3
      - vtk==9.6.0
      - pyqt5==5.15.11
      - requests==2.32.5
